name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Pinned to the exact @playwright/test version in package-lock.json.
    # Ships OS deps (fonts, GStreamer, etc.) and browsers pre-baked, so no
    # apt-get or `playwright install` step is needed, and CI isn't exposed to
    # a slow/flaky Ubuntu package mirror on every run.
    # If package-lock.json's @playwright/test version ever changes, bump the
    # tag below to match, otherwise the test runner and the image's browsers
    # can drift out of sync.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    # GitHub Actions overrides $HOME for container jobs to a path not owned
    # by the image's user; Firefox refuses to launch a profile under an
    # unowned $HOME, so it's reset to the container's actual home directory.
    env:
      HOME: /root

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Playwright tests
        run: npm test

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
